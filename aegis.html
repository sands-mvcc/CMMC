<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Tactical - Admin Console</title>
    <style>
        :root {
            --bg-body: #ffffff;
            --bg-panel: #f8f8f8;
            --text-main: #121212;
            --text-muted: #555555;
            --primary-green: #008f39;
            --bright-green: #00cf52;
            --accent-black: #000000;
            --border-color: #dddddd;
            --cui-warning: #ffcc00;
            --danger: #d32f2f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        
        body { background-color: var(--bg-body); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }

        /* Header */
        header { background-color: var(--accent-black); color: white; padding: 1rem 2rem; border-bottom: 4px solid var(--primary-green); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        .cui-banner { background-color: var(--cui-warning); color: #000; text-align: center; font-weight: bold; font-size: 0.9rem; padding: 0.5rem; letter-spacing: 1px; text-transform: uppercase; }
        .logo h1 { font-size: 1.8rem; letter-spacing: -1px; text-transform: uppercase; }
        .logo span { color: var(--bright-green); }

        /* Nav */
        nav { background-color: var(--bg-panel); border-bottom: 1px solid var(--border-color); padding: 0 2rem; }
        .nav-links { display: flex; gap: 2rem; list-style: none; overflow-x: auto; }
        .nav-links li { padding: 1rem 0; cursor: pointer; color: var(--text-muted); transition: 0.3s; font-weight: bold; border-bottom: 3px solid transparent; }
        .nav-links li:hover, .nav-links li.active { color: var(--accent-black); border-bottom-color: var(--primary-green); }

        /* Main */
        main { flex: 1; padding: 2rem; max-width: 1400px; margin: 0 auto; width: 100%; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 2px solid var(--primary-green); padding-bottom: 0.5rem; flex-wrap: wrap; gap: 10px; }
        .section-title { font-size: 1.5rem; color: var(--accent-black); }
        
        /* Tables */
        .table-container { overflow-x: auto; background: white; border: 1px solid var(--border-color); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #eee; vertical-align: middle; }
        th { background-color: var(--accent-black); color: white; text-transform: uppercase; letter-spacing: 1px; position: sticky; top: 0; }
        tr:nth-child(even) { background-color: #fafafa; }
        tr:hover { background-color: #e8f5e9; }

        /* Badges */
        .badge { padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; display: inline-block; }
        .badge-cui { background: var(--cui-warning); color: black; border: 1px solid #997a00; }
        .badge-fci { background: #e0e0e0; color: black; border: 1px solid #999; }
        
        /* Buttons & Inputs */
        .btn { padding: 0.5rem 1rem; background: var(--accent-black); color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 2px; }
        .btn:hover { background: var(--primary-green); }
        .btn-sm { padding: 0.2rem 0.5rem; font-size: 0.75rem; margin-right: 5px; }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #b71c1c; }
        .btn-add { background: var(--primary-green); border: 1px solid var(--primary-green); }
        .search-box { padding: 0.5rem; border: 2px solid var(--primary-green); width: 250px; font-family: inherit; }

        /* Modals */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal { background: white; padding: 2rem; width: 500px; max-width: 90%; border-top: 5px solid var(--primary-green); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .modal h2 { margin-bottom: 1.5rem; border-bottom: 1px solid #eee; padding-bottom: 0.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.3rem; font-weight: bold; font-size: 0.9rem; }
        .form-group input, .form-group select { width: 100%; padding: 0.5rem; border: 1px solid #ccc; font-family: inherit; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem; }

        /* Footer */
        footer { background: var(--accent-black); color: #888; text-align: center; padding: 2rem; margin-top: auto; font-size: 0.8rem; border-top: 4px solid var(--primary-green); }

        /* Grid for Overview */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        .card { background: var(--bg-panel); padding: 1.5rem; border: 1px solid var(--border-color); border-left: 5px solid var(--primary-green); }
    </style>
</head>
<body>

    <header>
        <div class="cui-banner">⚠ Controlled Unclassified Information (CUI) ⚠</div>
        <div class="top-bar">
            <div class="logo">
                <h1>Aegis <span>Tactical</span></h1>
            </div>
            <div style="text-align: right;">
                <div>MODE: <span style="color: var(--bright-green)">ADMIN/EDIT</span></div>
                <div style="font-size: 0.8rem; opacity: 0.8;">SESSION: ACTIVE</div>
            </div>
        </div>
    </header>

    <nav>
        <ul class="nav-links">
            <li class="active" onclick="switchTab('personnel')">Personnel Mgmt</li>
            <li onclick="switchTab('assets')">Asset Inventory</li>
            <li onclick="switchTab('overview')">Locations</li>
        </ul>
    </nav>

    <main id="content-area">
        </main>

    <div id="editModal" class="modal-overlay">
        <div class="modal">
            <h2 id="modalTitle">Edit Item</h2>
            <form id="modalForm">
                <div id="modalFields"></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-danger" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-add">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>Aegis Tactical Solutions, Inc. | CAGE: 7H3X9</p>
        <p>Simulated Environment - Changes persist for current session only.</p>
    </footer>

    <script>
        // --- INITIAL DATA ---
        let employees = [
            { id: "E001", name: "Sarah Jenkins", title: "CISO", dept: "Executive", loc: "HQ", access: "ALL", citizen: "US" },
            { id: "E002", name: "Marcus Thorne", title: "CIO", dept: "Executive", loc: "HQ", access: "ALL", citizen: "US" },
            { id: "T001", name: "David Wu", title: "Dir. Infrastructure", dept: "IT", loc: "HQ", access: "ADMIN", citizen: "US" },
            { id: "G002", name: "Bruce Banner", title: "Materials Scientist", dept: "R&D", loc: "Atlanta", access: "CUI", citizen: "Green Card" },
            { id: "M001", name: "Bob Belcher", title: "Floor Foreman", dept: "Mfg", loc: "Clearwater", access: "FCI", citizen: "US" },
            { id: "M010", name: "Jim Miller", title: "Plant Ops Mgr", dept: "Ops", loc: "Atlanta", access: "FCI", citizen: "US" },
            { id: "C001", name: "Sterling Archer", title: "Gov Liaison", dept: "Sales", loc: "Arlington", access: "CUI", citizen: "US" }
        ];

        let assets = [
            { tag: "ATS-SVR-01", type: "Server", model: "Dell PowerEdge R740", os: "Win Svr 2019", loc: "HQ", data: "CUI, PII", notes: "Domain Controller" },
            { tag: "ATS-SVR-03", type: "Server", model: "Legacy HP ProLiant", os: "Win Svr 2012 R2", loc: "HQ", data: "FCI", notes: "Legacy Accounting (EOL)" },
            { tag: "ATS-ATL-HMI-01", type: "OT/HMI", model: "Siemens Simatic", os: "Windows 7 Emb", loc: "Atlanta", data: "CUI (Specs)", notes: "Molding Press Control" },
            { tag: "ATS-PRT-01", type: "Printer", model: "Xerox AltaLink", os: "Firmware v2.4", loc: "HQ", data: "CUI", notes: "Internal HDD Unencrypted" },
            { tag: "ATS-IOT-SEW-A", type: "OT/IoT", model: "Juki SmartSew", os: "Embedded Linux", loc: "Clearwater", data: "FCI", notes: "Connected to Corp Wifi" }
        ];

        let currentMode = ''; // 'employee' or 'asset'
        let editingIndex = -1; // -1 for add, >=0 for edit

        // --- RENDER LOGIC ---

        function renderPersonnel() {
            let html = `
                <div class="section-header">
                    <h2 class="section-title">Employee Directory</h2>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="empSearch" class="search-box" placeholder="Search..." onkeyup="filterTable('empTable', 'empSearch')">
                        <button class="btn btn-add" onclick="openModal('employee', -1)">+ Add Employee</button>
                    </div>
                </div>
                <div class="table-container">
                    <table id="empTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Title</th>
                                <th>Dept</th>
                                <th>Loc</th>
                                <th>Access</th>
                                <th>Citizen</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            employees.forEach((p, index) => {
                let badgeClass = p.access.includes('CUI') ? 'badge-cui' : (p.access.includes('FCI') ? 'badge-fci' : '');
                let accessBadge = p.access === 'NONE' ? 'None' : `<span class="badge ${badgeClass}">${p.access}</span>`;
                html += `
                    <tr>
                        <td><strong>${p.id}</strong></td>
                        <td>${p.name}</td>
                        <td>${p.title}</td>
                        <td>${p.dept}</td>
                        <td>${p.loc}</td>
                        <td>${accessBadge}</td>
                        <td>${p.citizen}</td>
                        <td>
                            <button class="btn btn-sm" onclick="openModal('employee', ${index})">Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteItem('employee', ${index})">Del</button>
                        </td>
                    </tr>`;
            });
            html += `</tbody></table></div>`;
            return html;
        }

        function renderAssets() {
            let html = `
                <div class="section-header">
                    <h2 class="section-title">Asset Inventory</h2>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="assetSearch" class="search-box" placeholder="Search..." onkeyup="filterTable('assetTable', 'assetSearch')">
                        <button class="btn btn-add" onclick="openModal('asset', -1)">+ Add Asset</button>
                    </div>
                </div>
                <div class="table-container">
                    <table id="assetTable">
                        <thead>
                            <tr>
                                <th>Tag</th>
                                <th>Type</th>
                                <th>Model</th>
                                <th>OS</th>
                                <th>Location</th>
                                <th>Data Class</th>
                                <th>Notes</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            assets.forEach((a, index) => {
                let dataBadge = a.data.includes('CUI') ? '<span class="badge badge-cui">CUI</span>' : (a.data.includes('FCI') ? '<span class="badge badge-fci">FCI</span>' : 'N/A');
                html += `
                    <tr>
                        <td style="font-family:monospace; font-weight:bold;">${a.tag}</td>
                        <td>${a.type}</td>
                        <td>${a.model}</td>
                        <td>${a.os}</td>
                        <td>${a.loc}</td>
                        <td>${dataBadge}</td>
                        <td>${a.notes}</td>
                        <td>
                            <button class="btn btn-sm" onclick="openModal('asset', ${index})">Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteItem('asset', ${index})">Del</button>
                        </td>
                    </tr>`;
            });
            html += `</tbody></table></div>`;
            return html;
        }

        function renderOverview() {
             return `
                <div class="section-header">
                    <h2 class="section-title">Company Locations</h2>
                </div>
                <div class="grid-container">
                    <div class="card">
                        <h3>HQ - St. Petersburg</h3>
                        <p>Executive, HR, Finance, Core IT. <br><strong>Risk:</strong> High (Data Concentration)</p>
                    </div>
                    <div class="card">
                        <h3>Mfg - Clearwater</h3>
                        <p>Textiles, Warehouse. <br><strong>Risk:</strong> Medium (IoT/Legacy Devices)</p>
                    </div>
                    <div class="card">
                        <h3>Mfg - Atlanta</h3>
                        <p>Heavy Equipment, Helmets. <br><strong>Risk:</strong> High (OT/ICS vulnerabilities)</p>
                    </div>
                    <div class="card">
                        <h3>Sales - Arlington</h3>
                        <p>Gov Liaison. <br><strong>Risk:</strong> High (CUI transmission)</p>
                    </div>
                </div>`;
        }

        // --- CRUD LOGIC ---

        function deleteItem(type, index) {
            if(!confirm("Are you sure you want to delete this record? This cannot be undone.")) return;
            
            if(type === 'employee') {
                employees.splice(index, 1);
                document.getElementById('content-area').innerHTML = renderPersonnel();
            } else {
                assets.splice(index, 1);
                document.getElementById('content-area').innerHTML = renderAssets();
            }
        }

        function openModal(type, index) {
            currentMode = type;
            editingIndex = index;
            const modal = document.getElementById('editModal');
            const title = document.getElementById('modalTitle');
            const fields = document.getElementById('modalFields');
            
            modal.style.display = 'flex';
            title.innerText = (index === -1 ? "Add New " : "Edit ") + (type === 'employee' ? "Employee" : "Asset");
            
            // Build Form
            let data = {};
            if(index >= 0) {
                data = type === 'employee' ? employees[index] : assets[index];
            }

            if(type === 'employee') {
                fields.innerHTML = `
                    <div class="form-group"><label>Employee ID</label><input type="text" name="id" value="${data.id || ''}" required></div>
                    <div class="form-group"><label>Full Name</label><input type="text" name="name" value="${data.name || ''}" required></div>
                    <div class="form-group"><label>Title</label><input type="text" name="title" value="${data.title || ''}"></div>
                    <div class="form-group"><label>Department</label><input type="text" name="dept" value="${data.dept || ''}"></div>
                    <div class="form-group"><label>Location</label>
                        <select name="loc">
                            <option value="HQ" ${data.loc === 'HQ' ? 'selected' : ''}>St. Petersburg (HQ)</option>
                            <option value="Clearwater" ${data.loc === 'Clearwater' ? 'selected' : ''}>Clearwater (Mfg)</option>
                            <option value="Atlanta" ${data.loc === 'Atlanta' ? 'selected' : ''}>Atlanta (Mfg)</option>
                            <option value="Arlington" ${data.loc === 'Arlington' ? 'selected' : ''}>Arlington (Sales)</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Access Level</label><input type="text" name="access" value="${data.access || ''}" placeholder="ALL, ADMIN, CUI, FCI, NONE"></div>
                    <div class="form-group"><label>Citizenship</label><input type="text" name="citizen" value="${data.citizen || ''}"></div>
                `;
            } else {
                fields.innerHTML = `
                    <div class="form-group"><label>Asset Tag</label><input type="text" name="tag" value="${data.tag || ''}" required></div>
                    <div class="form-group"><label>Type</label><input type="text" name="type" value="${data.type || ''}" placeholder="Server, Laptop, OT..."></div>
                    <div class="form-group"><label>Model</label><input type="text" name="model" value="${data.model || ''}"></div>
                    <div class="form-group"><label>OS / Firmware</label><input type="text" name="os" value="${data.os || ''}"></div>
                    <div class="form-group"><label>Location</label><input type="text" name="loc" value="${data.loc || ''}"></div>
                    <div class="form-group"><label>Data Classification</label><input type="text" name="data" value="${data.data || ''}" placeholder="CUI, FCI, PII, N/A"></div>
                    <div class="form-group"><label>Notes / Vulns</label><input type="text" name="notes" value="${data.notes || ''}"></div>
                `;
            }
        }

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        // Handle Form Submit
        document.getElementById('modalForm').onsubmit = function(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const obj = Object.fromEntries(formData.entries());

            if(currentMode === 'employee') {
                if(editingIndex >= 0) employees[editingIndex] = obj;
                else employees.push(obj);
                document.getElementById('content-area').innerHTML = renderPersonnel();
            } else {
                if(editingIndex >= 0) assets[editingIndex] = obj;
                else assets.push(obj);
                document.getElementById('content-area').innerHTML = renderAssets();
            }
            closeModal();
        };

        // --- TABS & FILTER ---

        function switchTab(tabName) {
            const contentArea = document.getElementById('content-area');
            document.querySelectorAll('.nav-links li').forEach(i => i.classList.remove('active'));
            event.target.classList.add('active');

            if(tabName === 'personnel') contentArea.innerHTML = renderPersonnel();
            if(tabName === 'assets') contentArea.innerHTML = renderAssets();
            if(tabName === 'overview') contentArea.innerHTML = renderOverview();
        }

        function filterTable(tableId, inputId) {
            const filter = document.getElementById(inputId).value.toUpperCase();
            const rows = document.getElementById(tableId).getElementsByTagName("tr");
            for (let i = 1; i < rows.length; i++) {
                rows[i].style.display = rows[i].innerText.toUpperCase().indexOf(filter) > -1 ? "" : "none";
            }
        }

        // Init
        document.getElementById('content-area').innerHTML = renderPersonnel();
    </script>
</body>
</html>
