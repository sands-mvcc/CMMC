<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMMC Documents and Reports</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f4f4; /* Neutral background to pop the green/black theme */
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border-top: 10px solid #2e7d32; /* Professor Sands Theme Green */
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 3px solid #000;
        }

        .header h1 {
            color: #000;
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .dod-badge {
            display: inline-block;
            background: #2e7d32;
            color: white;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .documents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .document-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }

        .document-card:hover {
            transform: translateY(-5px);
            border-color: #2e7d32;
            box-shadow: 0 12px 30px rgba(46, 125, 50, 0.15);
        }

        .document-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #000;
            margin-bottom: 8px;
        }

        .document-actions {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Themed Buttons */
        .link-btn {
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 2px solid transparent;
            cursor: pointer;
        }

        /* Document Button - Black Theme */
        .btn-doc {
            background: #000;
            color: #fff;
        }

        .btn-doc:hover {
            background: #333;
        }

        /* Tool Button - Green Theme */
        .btn-tool {
            background: #2e7d32;
            color: #fff;
        }

        .btn-tool:hover {
            background: #1b5e20;
        }

        .search-filter {
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
        }

        /* Existing details and grid layout logic preserved */
        .document-detail { display: none; margin-top: 30px; background: #fff; padding: 30px; border-radius: 15px; border: 2px solid #2e7d32; position: relative; }
        .document-detail.active { display: block; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; border: none; background: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="dod-badge">Cybersecurity & AI Training Portal</div>
            <h1>CMMC Documentation & Interactive Tools</h1>
            <p>Access required CMMC 2.0 compliance documents and interactive simulation tools for workforce development.</p>
        </div>

        <div class="search-filter">
            <input type="text" class="search-input" placeholder="Search by document or requirement..." id="searchInput">
        </div>

        <div class="documents-grid" id="documentsGrid">
            </div>

        <div class="document-detail" id="documentDetail">
            <button class="close-btn" onclick="closeDetail()">&times;</button>
            <div id="detailContent"></div>
        </div>
    </div>

    <script>
        const documents = [
            { id: 'ssp', title: 'System Security Plan (SSP)', level: 2, filename: 'ssp.html', toolname: 'SSP_tool.html', tags: ['Required', 'NIST 800-171'], preview: 'Comprehensive blueprint of the organization’s cybersecurity posture.' },
            { id: 'poam', title: 'Plan of Action & Milestones (POA&M)', level: 2, filename: 'POAM.html', toolname: 'POAM_tool.html', tags: ['Remediation', 'Active'], preview: 'Tracking and remediating security control gaps.' },
            { id: 'asset-inventory', title: 'Asset Inventory & Categorization', level: 1, filename: 'asset.html', toolname: 'Asset_tool.html', tags: ['Scoping', 'Inventory'], preview: 'Inventory of all hardware, software, and CUI assets.' },
            { id: 'sar', title: 'Security Assessment Report (SAR)', level: 2, filename: 'sar.html', toolname: 'SAR_tool.html', tags: ['C3PAO', 'Audit'], preview: 'Results of the formal security control assessment.' },
            { id: 'irp', title: 'Incident Response Plan (IRP)', level: 2, filename: 'irp.html', toolname: 'IRP_tool.html', tags: ['NIST 800-61', 'Response'], preview: 'Procedures for detecting and recovering from breaches.' },
            { id: 'access-matrix', title: 'Access Control Matrix', level: 2, filename: 'acm.html', toolname: 'ACM_tool.html', tags: ['Least Privilege', 'Access'], preview: 'Role-based permission framework for CUI systems.' },
            { id: 'audit-log', title: 'Audit Log & Monitoring Report', level: 2, filename: 'almr.html', toolname: 'ALMR_tool.html', tags: ['SIEM', 'Monitoring'], preview: 'Continuous monitoring and event logging strategies.' },
            { id: 'config-mgmt', title: 'Configuration Management Plan', level: 2, filename: 'cmp.html', toolname: 'CMP_tool.html', tags: ['Baselines', 'Change Control'], preview: 'Maintaining secure system configurations.' },
            { id: 'vuln-scan', title: 'Vulnerability Scan Reports', level: 2, filename: 'vsr.html', toolname: 'VSR_tool.html', tags: ['Scanning', 'Proactive'], preview: 'Documentation of regular vulnerability assessments.' },
            { id: 'sprs-score', title: 'SPRS Submission Score', level: 2, filename: 'sss.html', toolname: 'SSS_tool.html', tags: ['DoD', 'Compliance'], preview: 'Official self-assessment score submitted to the DoD.' },
            { id: 'maintenance', title: 'Maintenance Report', level: 1, filename: 'maintenance.html', toolname: 'Maintenance_tool.html', tags: ['Lifecycle', 'Operations'], preview: 'Logs of system patching and lifecycle maintenance.' }
        ];

        function renderDocuments() {
            const grid = document.getElementById('documentsGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();

            grid.innerHTML = documents
                .filter(d => d.title.toLowerCase().includes(search))
                .map(doc => `
                <div class="document-card">
                    <div class="document-title">${doc.title}</div>
                    <p style="font-size: 0.9rem; color: #555; margin-bottom: 15px;">${doc.preview}</p>
                    <div class="document-actions">
                        <a href="${doc.filename}" class="link-btn btn-doc">📄 Open Document</a>
                        <a href="${doc.toolname}" class="link-btn btn-tool">🛠️ Open Tool</a>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', renderDocuments);
        renderDocuments();
    </script>
</body>
</html>
